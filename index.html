<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Hotel IPTV System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hotel_iptv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hotel_iptv</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0D0D0D;
      color: #FFFFFF;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #0D0D0D;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      color: #D4AF37;
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .loading-subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }
    #error-log {
      display: none;
      margin-top: 20px;
      padding: 16px;
      max-width: 80%;
      background: rgba(255, 0, 0, 0.15);
      border: 1px solid #ff4444;
      border-radius: 8px;
      color: #ff6666;
      font-family: monospace;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">HOTEL IPTV</div>
    <div class="loading-subtitle">Memuat aplikasi...</div>
    <div id="error-log"></div>
  </div>

  <script>
    // Tangkap error JavaScript agar tampil di layar jika terjadi masalah
    function showError(msg) {
      var log = document.getElementById('error-log');
      if (log) {
        log.style.display = 'block';
        log.innerText = 'Error: ' + msg;
      }
    }
    window.onerror = function(message, source, lineno, colno, error) {
      showError(message + ' (' + source + ':' + lineno + ')');
    };
    window.onunhandledrejection = function(event) {
      showError(event.reason);
    };

    // Polyfill dynamic import() untuk Smart TV yang tidak mendukung import() statement
    window._loadModule = function(url) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = function() {
          if (window.CanvasKitInit) {
            resolve({ default: window.CanvasKitInit });
          } else {
            resolve(window);
          }
        };
        s.onerror = function() {
          reject(new Error('Gagal memuat module: ' + url));
        };
        document.head.appendChild(s);
      });
    };

    // Load main.dart.js langsung
    var script = document.createElement('script');
    script.src = 'main.dart.js';
    script.type = 'application/javascript';
    script.onload = function() {
      // Hapus loading container saat Flutter sudah siap
      setTimeout(function() {
        var loader = document.getElementById('loading-container');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            loader.remove();
          }, 500);
        }
      }, 1500);
    };
    script.onerror = function() {
      showError('Gagal memuat main.dart.js. Periksa koneksi internet.');
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
