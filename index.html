<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Hotel IPTV System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hotel_iptv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hotel_iptv</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #FFFFFF;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <script>
    // Polyfill dynamic import() untuk Smart TV yang tidak mendukung import() statement
    window._loadModule = function(url) {
      return new Promise(function(resolve, reject) {
        if (window.CanvasKitInit) {
          resolve({ default: window.CanvasKitInit });
          return;
        }
        var s = document.createElement('script');
        s.src = url;
        s.onload = function() {
          resolve({ default: window.CanvasKitInit || window });
        };
        s.onerror = function(err) {
          reject(new Error('Gagal memuat module: ' + url));
        };
        document.head.appendChild(s);
      });
    };

    // Load main.dart.js dengan cache-buster
    var script = document.createElement('script');
    script.src = 'main.dart.js?v=' + new Date().getTime();
    script.type = 'application/javascript';
    document.body.appendChild(script);
  </script>
</body>
</html>
